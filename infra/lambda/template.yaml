AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Brain Ink backend migration (Lambda + SQS + API Gateway)

Parameters:
  StageName:
    Type: String
    Default: prod
  DatabaseUrl:
    Type: String
    NoEcho: true
  PgDisableSsl:
    Type: String
    Default: 'false'
  InternalJobRunnerToken:
    Type: String
    NoEcho: true
  BackendInternalBaseUrl:
    Type: String
    Default: ''
    Description: Legacy parameter retained for compatibility. Generation no longer uses an HTTP relay.
  FigureBaseUrl:
    Type: String
    Default: ''
    Description: Same CDN origin as the frontend NEXT_PUBLIC_FIGURE_BASE_URL.
  AwsRegion:
    Type: String
    Default: eu-west-1

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 1024
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        PG_DISABLE_SSL: !Ref PgDisableSsl
        INTERNAL_JOB_RUNNER_TOKEN: !Ref InternalJobRunnerToken
        BACKEND_INTERNAL_BASE_URL: !Ref BackendInternalBaseUrl
        BEDROCK_REGION: !Ref AwsRegion

Resources:
  QueueSenderPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allow the Amplify runtime to submit background AI jobs.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt AiJobQueue.Arn
  BackendApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        AllowOrigins: ['*']

  AiJobQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 5400
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiJobDLQ.Arn
        maxReceiveCount: 3

  AiJobDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  SubmitAiJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../.ai-worker/
      Handler: index.submitHandler
      Events:
        SubmitAiJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /api/jobs
            Method: POST
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AiJobQueue.QueueName
      Environment:
        Variables:
          AI_JOB_QUEUE_URL: !Ref AiJobQueue

  GetAiJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../.ai-worker/
      Handler: index.statusHandler
      Events:
        GetAiJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /api/jobs/{id}
            Method: GET

  ExecuteAiJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../.ai-worker/
      Handler: index.handler
      Timeout: 900
      MemorySize: 2048
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          NEXT_PUBLIC_FIGURE_BASE_URL: !Ref FigureBaseUrl
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSPollerPolicy:
            QueueName: !GetAtt AiJobQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt AiJobQueue.Arn
            BatchSize: 1
            Enabled: true
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiBaseUrl:
    Description: API base URL for frontend
    Value: !Sub 'https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
  AiJobQueueUrl:
    Description: SQS queue URL
    Value: !Ref AiJobQueue
  WorkerFunctionName:
    Value: !Ref ExecuteAiJobFunction
  QueueSenderPolicyArn:
    Value: !Ref QueueSenderPolicy
