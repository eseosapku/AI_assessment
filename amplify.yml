version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify console env vars are NOT auto-available to Next.js SSR at runtime.
        # Add these in Amplify → Environment variables (aws_deploy branch), then they
        # are written into .env.production before build:
        #   FLW_SECRET_KEY, FLW_PUBLIC_KEY, FLW_WEBHOOK_SECRET, FLW_REDIRECT_URL
        #   FLW_SUBSCRIPTION_AMOUNT_USD=5, FLW_SUBSCRIPTION_AMOUNT_RWF=1500
        #   NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_SUBSCRIPTION_AMOUNT_USD=5
        #   NEXT_PUBLIC_SUBSCRIPTION_AMOUNT_RWF=1500
        #   DATABASE_URL, JWT_SECRET, BEDROCK_*, PG_DISABLE_SSL
        #   SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS
        #   EMAIL_FROM, EMAIL_FROM_NAME
        #   GOOGLE_CLIENT_ID, NEXT_PUBLIC_GOOGLE_CLIENT_ID
        - env | grep -E '^(FLW_|DATABASE_URL|JWT_SECRET|BEDROCK_|PG_DISABLE_SSL|INTERNAL_JOB|AI_JOB_QUEUE|BACKEND_INTERNAL|SMTP_|EMAIL_|GOOGLE_)' >> .env.production || true
        - env | grep -e NEXT_PUBLIC_ >> .env.production || true
        - npm run build
        - cp .env.production .next/standalone/.env.production 2>/dev/null || true
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
