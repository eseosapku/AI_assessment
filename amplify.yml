version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "JWT_SECRET=$JWT_SECRET" >> .env.production
        - echo "PG_DISABLE_SSL=$PG_DISABLE_SSL" >> .env.production
        - echo "BEDROCK_ACCESS_KEY_ID=$BEDROCK_ACCESS_KEY_ID" >> .env.production
        - echo "BEDROCK_SECRET_ACCESS_KEY=$BEDROCK_SECRET_ACCESS_KEY" >> .env.production
        - echo "BEDROCK_REGION=$BEDROCK_REGION" >> .env.production
        - echo "FLW_SECRET_KEY=$FLW_SECRET_KEY" >> .env.production
        - echo "FLW_PUBLIC_KEY=$FLW_PUBLIC_KEY" >> .env.production
        - echo "FLW_WEBHOOK_SECRET=$FLW_WEBHOOK_SECRET" >> .env.production
        - echo "FLW_REDIRECT_URL=$FLW_REDIRECT_URL" >> .env.production
        - echo "FLW_SUBSCRIPTION_AMOUNT_USD=$FLW_SUBSCRIPTION_AMOUNT_USD" >> .env.production
        - echo "FLW_SUBSCRIPTION_AMOUNT_RWF=$FLW_SUBSCRIPTION_AMOUNT_RWF" >> .env.production
        - echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" >> .env.production
        - echo "NEXT_PUBLIC_SUBSCRIPTION_AMOUNT_USD=$NEXT_PUBLIC_SUBSCRIPTION_AMOUNT_USD" >> .env.production
        - echo "NEXT_PUBLIC_SUBSCRIPTION_AMOUNT_RWF=$NEXT_PUBLIC_SUBSCRIPTION_AMOUNT_RWF" >> .env.production
        - echo "NEXT_PUBLIC_USE_ASYNC_AI_JOBS=$NEXT_PUBLIC_USE_ASYNC_AI_JOBS" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
