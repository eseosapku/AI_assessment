name: Deploy Backend Lambda

on:
  push:
    branches:
      - aws_deploy
      - main
    paths:
      - "app/api/auth/**"
      - "app/api/jobs/**"
      - "app/api/generate-assessment/**"
      - "lib/**"
      - "data/**"
      - "systems/**"
      - "scripts/build-ai-worker.cjs"
      - "infra/lambda/handlers/**"
      - "lib/db.ts"
      - "lib/ai-jobs.ts"
      - "lib/api-url.ts"
      - "lib/auth-user.ts"
      - "lib/countries.ts"
      - "lib/email.ts"
      - "lib/gender.ts"
      - "lib/google-auth.ts"
      - "lib/nigeria-curriculum.ts"
      - "lib/password-reset-otp.ts"
      - "lib/rate-limit.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck/build app
        run: npm run build

      - name: Bundle single Lambda handler
        run: |
          rm -rf lambda-dist lambda-package.zip
          npm run build:lambda
          cd .ai-worker
          zip -r ../lambda-package.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name studysquare_function \
            --zip-file fileb://lambda-package.zip
          aws lambda wait function-updated \
            --function-name studysquare_function

      - name: Set Lambda handler
        run: |
          aws lambda update-function-configuration \
            --function-name studysquare_function \
            --handler index.handler \
            --runtime nodejs24.x \
            --timeout 900
          aws lambda wait function-updated \
            --function-name studysquare_function

      - name: Allow background work in the same Lambda
        run: |
          function_arn=$(aws lambda get-function-configuration --function-name studysquare_function --query FunctionArn --output text)
          role_arn=$(aws lambda get-function-configuration --function-name studysquare_function --query Role --output text)
          cat > lambda-execution-policy.json <<EOF
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"lambda:InvokeFunction","Resource":"$function_arn"},{"Effect":"Allow","Action":["bedrock:InvokeModel","bedrock:InvokeModelWithResponseStream"],"Resource":"*"}]}
          EOF
          aws iam put-role-policy --role-name "${role_arn##*/}" --policy-name AssessmentBackgroundExecution --policy-document file://lambda-execution-policy.json
